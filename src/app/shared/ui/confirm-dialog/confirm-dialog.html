@if (open()) {
  <div class="confirm-backdrop" role="presentation" (click)="cancel.emit()">
    <div
      class="confirm-dialog surface"
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirm-dialog-title"
      (click)="$event.stopPropagation()"
    >
      <h2 id="confirm-dialog-title">{{ title() }}</h2>
      <p class="text-muted">{{ description() }}</p>
      <div class="confirm-dialog__actions">
        <button class="button button-secondary" type="button" (click)="cancel.emit()">
          Keep it
        </button>
        <button
          class="button button-primary confirm-dialog__danger"
          type="button"
          (click)="confirm.emit()"
        >
          {{ confirmLabel() }}
        </button>
      </div>
    </div>
  </div>
}

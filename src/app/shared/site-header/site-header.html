<header class="site-header">
     <div class="site-header__inner">
          <a class="site-brand" [routerLink]="['/']" aria-label="WABAFlow home" (click)="closeMenu()">
               <span class="site-brand__mark" aria-hidden="true">W</span>
               <span class="site-brand__name">WABA<span class="text-brand">Flow</span></span>
          </a>

          <button class="button button-secondary site-header__menu-toggle" type="button"
               [attr.aria-label]="menuOpen ? 'Close navigation' : 'Open navigation'" [attr.aria-expanded]="menuOpen"
               aria-controls="site-navigation" (click)="toggleMenu()">
               @if (menuOpen) {
               <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
                    <path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-linecap="round" stroke-width="1.8" />
               </svg>
               } @else {
               <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
                    <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-linecap="round" stroke-width="1.8" />
               </svg>
               }
          </button>

          <div id="site-navigation" class="site-header__controls" [class.site-header__controls--open]="menuOpen">
               @if (showMarketingLinks) {
               <nav class="site-nav" aria-label="Main navigation">
                    <a class="site-nav__link" [routerLink]="['/']" fragment="modules" (click)="closeMenu()">
                         Modules
                    </a>
                    <a class="site-nav__link" [routerLink]="['/']" fragment="flow-first" (click)="closeMenu()">
                         How it works
                    </a>
                    <a class="site-nav__link" [routerLink]="['/']" fragment="roles" (click)="closeMenu()">
                         Roles
                    </a>
                    <a class="site-nav__link" [routerLink]="['/']" fragment="plans" (click)="closeMenu()">
                         Plans
                    </a>
                    <a class="site-nav__link" [routerLink]="['/']" fragment="faq" (click)="closeMenu()">
                         FAQ
                    </a>
               </nav>
               }

               <div class="site-header__actions">
                    <button class="button button-secondary site-header__theme-toggle" type="button"
                         [attr.aria-label]="theme.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
                         [attr.aria-pressed]="theme.isDark()" (click)="theme.toggleTheme()">
                         @if (theme.isDark()) {
                         <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
                              <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8" />
                              <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"
                                   stroke="currentColor" stroke-linecap="round" stroke-width="1.8" />
                         </svg>
                         <span>Light</span>
                         } @else {
                         <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
                              <path d="M20.1 15.6A8.6 8.6 0 0 1 8.4 3.9 8.7 8.7 0 1 0 20.1 15.6Z" stroke="currentColor"
                                   stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" />
                         </svg>
                         <span>Dark</span>
                         }
                    </button>

                    @if (showMarketingLinks) {
                    <a class="button button-primary site-header__cta" [routerLink]="['/login']" (click)="closeMenu()">
                         Log in
                    </a>
                    } @else {
                    <a class="button button-primary site-header__cta" [routerLink]="['/']" (click)="closeMenu()">
                         Back to home
                    </a>
                    }
               </div>
          </div>
     </div>
</header>

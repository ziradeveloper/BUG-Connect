<!doctype html>
<html lang="en" data-theme="light">

<head>
  <meta charset="utf-8">
  <title>BUGConnect — Multi-tenant WhatsApp Business workspace</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BUGConnect — Multi-tenant WhatsApp Business SaaS platform with Team Inbox, automated chat flows, template management, and broadcast campaigns.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;750;800&display=swap" rel="stylesheet">
  <script>
    (() => {
      try {
        const savedTheme = window.localStorage.getItem('bugconnect-theme');
        document.documentElement.dataset.theme = savedTheme === 'dark' ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
</head>

<body>
  <app-root></app-root>
</body>

</html>
